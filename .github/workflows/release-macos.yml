name: Build macOS release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release-macos.yml'
      - 'scripts/build-app.sh'
      - 'scripts/package-release.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      CLIPPER_REGISTER_APP: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release version
        id: version
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' assets/Info.plist)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a three-part version in assets/Info.plist, got $version"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match app version v$version"
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify release packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          xcodebuild -version
          bash scripts/package-release.sh
          cd dist
          unzip -tq "Clipper-$VERSION-macOS-arm64.zip"
          unzip -tq "Clipper-$VERSION-Sources.zip"
          shasum -a 256 -c "Clipper-$VERSION-SHA256.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Clipper-macOS
          path: |
            dist/Clipper-${{ steps.version.outputs.number }}-macOS-arm64.zip
            dist/Clipper-${{ steps.version.outputs.number }}-Sources.zip
            dist/Clipper-${{ steps.version.outputs.number }}-SHA256.txt
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Clipper-macOS
          path: dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          shasum -a 256 -c "Clipper-$version-SHA256.txt"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes 'Requires Apple Silicon and macOS 14 or later. This build is ad-hoc signed. macOS may require approval in System Settings → Privacy & Security on first launch.' \
            "Clipper-$version-macOS-arm64.zip" \
            "Clipper-$version-Sources.zip" \
            "Clipper-$version-SHA256.txt"
